<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AMZNEWS 已迁移到 aiamz.news</title>
<link rel="canonical" href="https://aiamz.news/">
<script>
// The reading preview moved to https://aiamz.news: send each old address to the same page there.
(function () {
  var base = '/amznews-reading-preview', p = location.pathname;
  if (p.indexOf(base) === 0) p = p.slice(base.length);
  p = p.replace(/\/index\.html$/, '/').replace(/\.html$/, '');
  var md = p.match(/^\/_mirror\/md\/([^/]+)\.md$/);
  if (md) p = '/items/' + md[1];
  else if (/^\/(_mirror|_img|assets)(\/|$)/.test(p)) p = '/';
  p = p.replace(/\/+$/, '') || '/';
  location.replace('https://aiamz.news' + p + location.search + location.hash);
})();
</script>
<meta http-equiv="refresh" content="3;url=https://aiamz.news/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #13191c; color: #e6edf0;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  a { color: #22d3ee; }
</style>
</head>
<body>
<p>AMZNEWS 已迁移到 <a href="https://aiamz.news/">aiamz.news</a>，正在跳转…</p>
</body>
